name: 合并commit

on:
  workflow_dispatch:
    inputs:
      start_commit:
        description: '起始 Commit Hash（包含）'
        required: true
      end_commit:
        description: '最终 Commit Hash（包含）'
        required: true
      squash_commit_title:
        description: '合并后的 Commit 标题'
        required: true
      target_branch:
        description: '目标分支名称（将被覆盖）'
        required: true

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Git 用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 切换到目标分支
        run: |
          git checkout ${{ inputs.target_branch }}

      - name: 软重置到 start_commit（包含）
        run: |
          git reset --soft ${{ inputs.start_commit }}^

      - name: 创建 squash 提交
        run: |
          git commit -m "${{ inputs.squash_commit_title }}"

      - name: 强制推送到远程
        run: |
          git push origin ${{ inputs.target_branch }} --force
