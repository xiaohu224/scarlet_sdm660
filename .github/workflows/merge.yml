name: 合并commit

on:
  workflow_dispatch:
    inputs:
      start_commit:
        description: '起始 Commit Hash（包含）'
        required: true
      end_commit:
        description: '最终 Commit Hash（包含）'
        required: true
      squash_commit_title:
        description: '合并后的 Commit 标题'
        required: true
      target_branch:
        description: '目标分支（PR 将会合并到此分支）'
        required: true

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Git 用户信息
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: 检出目标分支并创建 squash 分支
        run: |
          git checkout ${{ inputs.target_branch }}
          BRANCH_NAME=squash-auto-$(date +%s)
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME

      - name: 软重置到 start_commit（包含）
        run: |
          git reset --soft ${{ inputs.start_commit }}^

      - name: 创建 squash 提交
        run: |
          git commit -m "${{ inputs.squash_commit_title }}"

      - name: 推送到远程 squash 分支
        run: |
          git push origin ${{ env.branch_name }}

      - name: 创建 Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "${{ inputs.squash_commit_title }}"
          body: "本 PR 包含从 `${{ inputs.start_commit }}` 到 `${{ inputs.end_commit }}` 的 squash 提交"
          head: ${{ env.branch_name }}
          base: ${{ inputs.target_branch }}
